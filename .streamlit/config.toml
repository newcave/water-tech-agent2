[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#070d1a"
secondaryBackgroundColor = "#0f172a"
textColor = "#e2e8f0"
borderColor = "#1e293b"
linkColor = "#67e8f9"
font = "'Noto Sans KR':https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap"
baseRadius = "10px"
buttonRadius = "9px"
showWidgetBorder = true
paddingTop = "0"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false
